services:
  trackio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SOURCE_COMMIT=${SOURCE_COMMIT:-}
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_TRACKIO_7860
      - TRACKIO_DIR=/data
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - TRACKIO_WRITE_TOKEN=${SERVICE_PASSWORD_64_WRITETOKEN}
      - TRACKIO_AUTH_REQUIRED=${TRACKIO_AUTH_REQUIRED:-0}
      - TRACKIO_OIDC_REDIRECT_BASE=${SERVICE_FQDN_TRACKIO}
      - TRACKIO_OIDC_COOKIE_SECURE=${TRACKIO_OIDC_COOKIE_SECURE:-1}
    volumes:
      - trackio-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/version', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  trackio-data:
